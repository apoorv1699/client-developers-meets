<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Messages - C&D</title>
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}" href="/assets/css/styles.css" />
  </head>
  <body data-page="client-messages">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/">
          <span class="brand-mark">C&amp;D</span>
          <span>Client Messages</span>
        </a>
        <nav class="nav-links">
          <a href="/client/home">Dashboard</a>
          <a href="/client/developers">Developers</a>
          <a href="/client/messages">Messages</a>
        </nav>
        <div class="nav-actions">
          <span class="role-chip" data-role-chip>Client</span>
          <a class="btn btn-ghost" href="/login">Sign out</a>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container chat-layout">
        <aside class="card">
          <div class="card-title">Conversations</div>
          <div id="chat-threads" class="chat-list" style="margin-top: 1rem;"></div>
        </aside>
        <section class="card">
          <div id="chat-header" class="dev-header"></div>
          <div class="divider"></div>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="composer">
            <input class="input message-input" type="text" placeholder="Type a message..." data-message-input />
            <button class="btn btn-primary" type="button" data-send-message>Send</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="muted">Chat is mock data only for the demo.</div>
      </div>
    </footer>

    <script th:src="@{/assets/js/data.js}" src="/assets/js/data.js"></script>
    <script th:src="@{/assets/js/app.js}" src="/assets/js/app.js"></script>
  </body>
</html>
